  <rect x="250" y="405" width="700" height="65" rx="16" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text x="600" y="445" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" fill="#1849a9">ESP gửi packet; việc PC có bật hay không phụ thuộc NIC + BIOS/UEFI + trạng thái nguồn + mạng.</text>
