  <text x="600" y="235" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#344054">Web server + cấu hình Wi-Fi</text>
  <text x="600" y="268" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#344054">Magic Packet UDP/9</text>
