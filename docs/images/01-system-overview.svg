<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect width="1200" height="520" fill="#f7f9fc"/>
  <text x="600" y="54" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#172033">WakePC ESP32 — Tổng quan hệ thống</text>
  <rect x="70" y="150" width="250" height="190" rx="22" fill="#ffffff" stroke="#44546a" stroke-width="3"/>
  <text x="195" y="205" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#172033">Điện thoại / Laptop</text>
  <text x="195" y="248" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#344054">Mở wakepc.local</text>
