<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#172033">Magic Packet — cấu trúc và luồng gửi</text>
  <rect x="90" y="125" width="220" height="120" rx="18" fill="#fff" stroke="#344054" stroke-width="3"/>
  <text x="200" y="175" text-anchor="middle" font-family="Consolas,monospace" font-size="24" font-weight="700" fill="#101828">FF × 6</text>
  <text x="200" y="212" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475467">6 byte đồng bộ</text>
  <rect x="390" y="125" width="420" height="120" rx="18" fill="#fff" stroke="#1570ef" stroke-width="3"/>
  <text x="600" y="175" text-anchor="middle" font-family="Consolas,monospace" font-size="24" font-weight="700" fill="#175cd3">MAC × 16</text>
  <text x="600" y="212" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475467">96 byte địa chỉ MAC lặp lại</text>
  <rect x="890" y="125" width="220" height="120" rx="18" fill="#ecfdf3" stroke="#039855" stroke-width="3"/>
  <text x="1000" y="175" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#067647">102 byte</text>
  <text x="1000" y="212" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#475467">payload WOL</text>
  <line x1="310" y1="185" x2="380" y2="185" stroke="#667085" stroke-width="4"/><polygon points="380,185 360,174 360,196" fill="#667085"/>
  <line x1="810" y1="185" x2="880" y2="185" stroke="#667085" stroke-width="4"/><polygon points="880,185 860,174 860,196" fill="#667085"/>
  <rect x="260" y="310" width="680" height="70" rx="15" fill="#eef4ff" stroke="#84adff" stroke-width="2"/>
  <text x="600" y="353" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#1849a9">WakePC truyền payload này qua UDP port 9 tới một hoặc nhiều địa chỉ đích.</text>
</svg>
