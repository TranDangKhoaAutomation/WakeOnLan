<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
  <rect width="1200" height="570" fill="#f8fafc"/>
  <text x="600" y="50" text-anchor="middle" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#172033">Wake-on-LAN khi ESP và PC khác subnet</text>
  <g font-family="Segoe UI,Arial">
    <rect x="60" y="140" width="270" height="165" rx="18" fill="#eef4ff" stroke="#1570ef" stroke-width="3"/>
    <text x="195" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#175cd3">ESP32</text>
    <text x="195" y="232" text-anchor="middle" font-size="18" fill="#344054">192.168.10.50/24</text>
    <text x="195" y="265" text-anchor="middle" font-size="18" fill="#344054">Local BC: 192.168.10.255</text>

    <rect x="465" y="120" width="270" height="205" rx="18" fill="#fff" stroke="#475467" stroke-width="3"/>
    <text x="600" y="172" text-anchor="middle" font-size="24" font-weight="700">Router / L3</text>
    <text x="600" y="212" text-anchor="middle" font-size="18" fill="#344054">Có thể chặn</text>
    <text x="600" y="244" text-anchor="middle" font-size="18" fill="#b42318">directed broadcast</text>
    <text x="600" y="284" text-anchor="middle" font-size="18" fill="#344054">Unicast phụ thuộc ARP</text>

    <rect x="870" y="140" width="270" height="165" rx="18" fill="#ecfdf3" stroke="#039855" stroke-width="3"/>
    <text x="1005" y="190" text-anchor="middle" font-size="24" font-weight="700" fill="#067647">PC Ethernet</text>
    <text x="1005" y="232" text-anchor="middle" font-size="18" fill="#344054">10.20.30.40/24</text>
    <text x="1005" y="265" text-anchor="middle" font-size="18" fill="#344054">Target BC: 10.20.30.255</text>

    <line x1="330" y1="215" x2="455" y2="215" stroke="#667085" stroke-width="4"/><polygon points="455,215 435,204 435,226" fill="#667085"/>
    <line x1="735" y1="215" x2="860" y2="215" stroke="#667085" stroke-width="4"/><polygon points="860,215 840,204 840,226" fill="#667085"/>

    <rect x="110" y="390" width="980" height="110" rx="18" fill="#fff" stroke="#d0d5dd" stroke-width="2"/>
    <text x="600" y="428" text-anchor="middle" font-size="20" font-weight="700" fill="#172033">Độ tin cậy cao nhất: bộ phát WOL cùng L2/subnet với máy đích</text>
    <text x="600" y="462" text-anchor="middle" font-size="18" fill="#475467">Nếu khác subnet: dùng WOL relay / router directed broadcast đúng cấu hình; unicast chỉ là fallback.</text>
  </g>
</svg>
